<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCTLABS Customize</title>
  <meta name="description" content="Customize your selected ASCTLABS plan before moving to payment review." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="customize">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell compact-shell">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme"><span class="theme-toggle__dot"></span></button>
    <header class="topbar topbar--static">
      <a href="index.html" class="brand"><img class="brand__logo brand__logo--dark" src="assets/asctoz-logo-dark.png" alt="" /><img class="brand__logo brand__logo--light" src="assets/asctoz-logo-light.png" alt="" /><span>ASCTLABS</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mainNav" data-menu-toggle>
  <span></span>
  <span></span>
  <span></span>
</button>

<nav class="main-nav" id="mainNav" aria-label="Primary navigation">
  <a href="pricing.html">Pricing</a>
  <a href="checkout.html">Checkout</a>
</nav>
    </header>
    <main id="main" class="section page-intro">
      <div class="container split-panel">
        <div class="section-heading reveal is-visible">
          <p class="eyebrow">Customization</p>
          <h1>Shape the project around your needs.</h1>
          <p>These are visual placeholders for the next step in your funnel before final pricing review.</p>
        </div>
        <form class="custom-form reveal is-visible" action="checkout.html" method="get">
          <input type="hidden" name="plan" id="selectedPlan" value="A" />
          <label>
            Project style
            <textarea name="customization" placeholder="Describe your preferred project style..."></textarea>
          </label>
          <label>
            Timeline
            <select name="timeline">
              <option>Standard</option>
              <option>Priority</option>
              <option>Flexible</option>
            </select>
          </label>
          <label>
            Add-ons
            <select name="addons">
              <option>None</option>
              <option>Extra pages</option>
              <option>SEO setup</option>
              <option>Custom Domain</option>
            </select>
          </label>
          <label>
            Notes
            <textarea name="notes" rows="5" placeholder="Share a few details about your preferred style, pages, or goals."></textarea>
          </label>
          <button class="btn btn--primary" type="submit">Continue</button>
        </form>
      </div>
    </main>
  </div>
  <script src="theme.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || 'A';
    document.getElementById('selectedPlan').value = plan;
  </script>
  <script>
  (() => {
    const btn = document.querySelector('[data-menu-toggle]');
    const nav = document.getElementById('mainNav');
    if (!btn || !nav) return;

    const closeMenu = () => {
      nav.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
    };

    btn.addEventListener('click', () => {
      const open = nav.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', String(open));
    });

    nav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', closeMenu);
    });

    document.addEventListener('click', e => {
      if (!nav.contains(e.target) && !btn.contains(e.target)) closeMenu();
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) closeMenu();
    });
  })();
</script>
</body>
</html>
